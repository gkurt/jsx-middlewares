name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun check
      - run: bun run test
      - run: bun typecheck
      - run: bun run build

      # These all need the built dist: the docs site resolves `jsx-middlewares`
      # through the published `import` condition, and attw/publint pack the package.
      - run: bun run typecheck:website
      - run: bun run attw
      - run: bun run publint
