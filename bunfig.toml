# Prefer Bun to run scripts (bun run uses the Bun runtime, not Node).
[run]
bun = true

# Isolated installs — strict, symlinked node_modules (like pnpm), no phantom deps.
[install]
linker = "isolated"

# Only re-print failing tests on reruns. The test preload is passed on the command
# line in packages/jsx-middlewares so it resolves relative to that package.
[test]
onlyFailures = true
